name: maj-quotidienne-bvc
on:
  schedule:
    - cron: "30 16 * * 1-5" # 16h30 UTC (après la clôture de Casablanca à 15h30)
  workflow_dispatch:        # Permet de lancer la mise à jour manuellement en 1 clic

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python collect.py
      - run: |
          git config user.name "bvc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prix_historique.csv
          git commit -m "MAJ cours BVC $(date +%F)" || exit 0
          git push
